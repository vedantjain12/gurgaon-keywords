<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gurgaon Keyword Mapper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">
<style>
/* Editorial split: a narrow form column on the left, a wide reading column on the right. One accent, used for links, focus and the price. */
:root{--ink:#141414;--grey:#6b6b6b;--rule:#e5e5e5;--paper:#ffffff;--accent:#1f3fae;--warn:#a13a00;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;--geo:"Jost","Century Gothic",Futura,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:19px;line-height:1.6;padding-inline:24px;padding-block:72px 120px}
.wrap{max-width:1040px;margin-inline:auto}
.split{display:grid;grid-template-columns:230px minmax(0,1fr);column-gap:88px}
@media (max-width:820px){.split{grid-template-columns:minmax(0,1fr)}}
h1{grid-column:1 / -1;font-family:var(--serif);font-weight:500;font-size:clamp(38px,7vw,68px);line-height:1.05;letter-spacing:-.015em;margin:0 0 40px;max-width:13ch;text-wrap:balance}
.intro{grid-column:2;margin:0 0 96px;max-width:46ch;color:var(--grey)}
@media (max-width:820px){.intro{grid-column:1;margin-bottom:56px}}
aside{align-self:start;position:sticky;top:32px;font-family:var(--geo);font-size:16px}
@media (max-width:820px){aside{position:static;margin-bottom:72px}}
.field{margin-bottom:28px}
label{display:block;font-weight:500;margin-bottom:8px}
input,select{font:inherit;font-family:var(--geo);font-size:16px;color:var(--ink);background:var(--paper);border:0;border-bottom:1px solid var(--ink);border-radius:0;padding:6px 0;width:100%}
select{appearance:none;-webkit-appearance:none;cursor:pointer;padding-right:22px;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 9px) 55%,calc(100% - 4px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.note{font-family:var(--geo);font-size:14px;color:var(--grey);margin:0}
section{border-top:1px solid var(--rule);padding-block:40px 72px}
section:first-child{border-top:0;padding-top:0}
h2{font-family:var(--serif);font-weight:500;font-size:30px;line-height:1.2;margin:0 0 28px;letter-spacing:-.005em}
p{margin:0 0 16px;max-width:60ch}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-family:var(--geo);font-size:16px}
th{font-weight:500;text-align:left;padding:0 16px 10px 0;border-bottom:1px solid var(--ink);color:var(--grey)}
td{padding:12px 16px 12px 0;border-bottom:1px solid var(--rule)}
td:last-child,th:last-child{padding-right:0;color:var(--grey);white-space:nowrap}
td:first-child{color:var(--ink)}
.serp{border:1px solid var(--rule);padding:16px 18px;font-family:Arial,Helvetica,sans-serif;margin-bottom:16px}
.serp .u{color:#3c6b55;font-size:13px;overflow-wrap:anywhere}
.serp .ti{color:#1a4fa3;font-size:19px;line-height:1.3;overflow-wrap:anywhere}
.serp .de{color:#404040;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.count{font-family:var(--geo);font-size:14px;color:var(--grey);margin:0 0 4px}
.count.warn b{color:var(--warn)}
.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
button{font-family:var(--geo);font-size:15px;font-weight:500;background:var(--paper);color:var(--ink);border:1px solid var(--ink);border-radius:0;padding:7px 16px;cursor:pointer}
button:hover{background:var(--ink);color:var(--paper)}
.price{color:var(--accent)}
footer{margin-top:40px;font-family:var(--geo);font-size:14px;color:var(--grey);grid-column:2}
@media (max-width:820px){footer{grid-column:1}}
</style>
</head>
<body>
<div class="wrap">
  <div class="split">
    <h1>What your neighbours type into Google.</h1>
    <p class="intro">Pick your kind of business and your area. You get the searches to go after and the text to put on your website.</p>
    <aside>
      <form id="form" onsubmit="return false">
        <div class="field"><label for="btype">Kind of business</label><select id="btype"></select></div>
        <div class="field"><label for="area">Area</label><input id="area" list="areas" value="Sector 56" autocomplete="off" spellcheck="false"></div>
        <div class="field"><label for="bname">Business name</label><input id="bname" value="Example Dental Clinic" autocomplete="off" spellcheck="false"></div>
        <datalist id="areas"></datalist>
      </form>
      <p class="note" id="sample">Example shown. Type your own.</p>
    </aside>
    <main id="results" aria-live="polite"></main>
    <footer>From Vedant, a student in Gurgaon. Reply to the email that brought you here.</footer>
  </div>
</div>
<script>


const TYPES = {
  dentist:{label:'dental clinic',noun:'dental clinic',who:'patients',
    intents:['dentist','dental clinic','dental implants','root canal treatment','teeth whitening','braces','kids dentist','emergency dentist'],
    services:['dental implants','root canal treatment','teeth whitening','braces and aligners']},
  physio:{label:'physiotherapy clinic',noun:'physiotherapy clinic',who:'patients',
    intents:['physiotherapist','physiotherapy clinic','back pain treatment','knee pain physiotherapy','sports injury physio','neck pain treatment','home visit physiotherapy','post surgery rehab'],
    services:['back pain treatment','knee pain physiotherapy','sports injury rehab','home visits']},
  salon:{label:'salon',noun:'salon',who:'clients',
    intents:['salon','unisex salon','hair salon','bridal makeup','haircut','hair colour','facial','beauty parlour'],
    services:['haircuts','hair colour','facials','bridal makeup']},
  gym:{label:'gym',noun:'gym',who:'members',
    intents:['gym','fitness centre','personal trainer','weight loss gym','crossfit','yoga classes','zumba classes','gym with trainer'],
    services:['personal training','weight training','yoga classes','group classes']},
  workshop:{label:'car workshop',noun:'car workshop',who:'car owners',
    intents:['car service','car workshop','multi brand car service','car AC repair','car denting painting','car detailing','car wash','car mechanic'],
    services:['periodic car service','car AC repair','denting and painting','car detailing']},
  cafe:{label:'cafe',noun:'cafe',who:'guests',
    intents:['cafe','best cafe','coffee shop','brunch','birthday party venue','work friendly cafe','pet friendly cafe','dessert cafe'],
    services:['coffee','brunch','desserts','birthday bookings']},
  tutor:{label:'coaching centre',noun:'coaching centre',who:'students',
    intents:['tuition classes','coaching centre','maths tuition','IB tutor','home tutor','IGCSE tuition','CBSE tuition','online tuition'],
    services:['maths tuition','science tuition','IB and IGCSE support','exam preparation']}
};
const AREAS = ['DLF Phase 1','DLF Phase 2','DLF Phase 3','DLF Phase 4','DLF Phase 5','Sector 14','Sector 15','Sector 28','Sector 29','Sector 31','Sector 39','Sector 41','Sector 42','Sector 43','Sector 47','Sector 49','Sector 50','Sector 51','Sector 52','Sector 53','Sector 54','Sector 55','Sector 56','Sector 57','Sector 65','Sector 66','Sector 67','Sector 82','Sector 83','Sector 84','Sector 90','Golf Course Road','Golf Course Extension Road','Sohna Road','Sushant Lok 1','Sushant Lok 2','Palam Vihar','Udyog Vihar','MG Road','Cyber City','South City 1','Malibu Town','Nirvana Country'];

const $ = id => document.getElementById(id);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const join = a => a.length < 2 ? a.join('') : a.slice(0,-1).join(', ') + ' and ' + a[a.length-1];
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

for (const [k,v] of Object.entries(TYPES)) { const o = el('option', null, v.label); o.value = k; $('btype').appendChild(o); }
for (const a of AREAS) { const o = document.createElement('option'); o.value = a; $('areas').appendChild(o); }

function phrases(t, area){
  const a = area.toLowerCase(), out = [], seen = new Set();
  const add = (text, tag) => { if (!seen.has(text)) { seen.add(text); out.push({text, tag}); } };
  t.intents.slice(0,3).forEach(i => {
    add(`${i} in ${a}`, 'looking nearby');
    add(`${i} near ${a}`, 'looking nearby');
    add(`best ${i} in ${a}`, 'comparing');
    add(`${i} ${a} gurgaon`, 'looking nearby');
  });
  t.intents.slice(3).forEach(i => {
    add(`${i} in ${a}`, 'specific need');
    add(`best ${i} in ${a}`, 'comparing');
  });
  return out;
}
function makeTitle(t, area, name){
  const p = cap(t.intents[0]);
  const c = [`${p} in ${area}, Gurgaon | ${name}`, `${p} in ${area} | ${name}`, `${p} in ${area}, Gurgaon`];
  return c.find(x => x.length <= 60) || c[2];
}
function makeMeta(t, area, name){
  for (let n = 3; n >= 1; n--) {
    const s = `${name} is a ${t.noun} in ${area}, Gurgaon offering ${join(t.services.slice(0,n))}. Call or book online today.`;
    if (s.length <= 155) return s;
  }
  return `${name} is a ${t.noun} in ${area}, Gurgaon. Call or book online today.`;
}
function makeGbp(t, area, name){
  return `${name} is a ${t.noun} in ${area}, Gurgaon. We help ${t.who} across ${area} and nearby areas with ${join(t.services)}. We explain every option in plain language and give a clear price before any work begins. Call or message us to book a time that suits you.`.slice(0,750);
}
async function copyText(text, btn){
  const old = btn.textContent;
  try { await navigator.clipboard.writeText(text); btn.textContent = 'Copied'; }
  catch (e) { btn.textContent = 'Select the text and copy'; }
  setTimeout(() => btn.textContent = old, 1600);
}
function count(label, len, max){
  const p = el('p', 'count' + (len > max ? ' warn' : ''));
  p.append(document.createTextNode(label + ': '));
  p.appendChild(el('b', null, `${len} of ${max} characters`));
  return p;
}
function copyBtn(label, text){
  const b = el('button', null, label); b.type = 'button';
  b.addEventListener('click', () => copyText(text, b)); return b;
}
function render(){
  const t = TYPES[$('btype').value];
  const area = $('area').value.trim() || 'Gurgaon';
  const name = $('bname').value.trim() || 'Your business';
  const list = phrases(t, area);
  const title = makeTitle(t, area, name), meta = makeMeta(t, area, name), gbp = makeGbp(t, area, name);
  const out = document.createDocumentFragment();

  const s1 = el('section');
  s1.appendChild(el('h2', null, `Searches to go after in ${area}`));
  const wrap = el('div', 'tablewrap'), tb = el('table');
  const hr = el('tr'); hr.append(el('th', null, 'Search'), el('th', null, 'Searcher'));
  tb.appendChild(hr);
  list.slice(0, 6).forEach(p => { const r = el('tr'); r.append(el('td', null, p.text), el('td', null, p.tag)); tb.appendChild(r); });
  wrap.appendChild(tb); s1.appendChild(wrap);
  s1.appendChild(el('p', 'count', `${list.length - 6} more come with the full pack.`));
  s1.lastChild.style.marginTop = '16px';
  out.appendChild(s1);

  const s2 = el('section');
  s2.appendChild(el('h2', null, 'Title and description for your website'));
  const serp = el('div', 'serp');
  serp.append(el('div', 'u', 'www.yourwebsite.com'), el('div', 'ti', title), el('div', 'de', meta));
  s2.appendChild(serp);
  s2.appendChild(count('Title', title.length, 60));
  s2.appendChild(count('Description', meta.length, 155));
  const b1 = el('div', 'btns'); b1.append(copyBtn('Copy title', title), copyBtn('Copy description', meta)); s2.appendChild(b1);
  out.appendChild(s2);

  const s3 = el('section');
  s3.appendChild(el('h2', null, 'Google Business text'));
  s3.appendChild(el('p', null, gbp));
  s3.appendChild(count('Length', gbp.length, 750));
  const b2 = el('div', 'btns'); b2.appendChild(copyBtn('Copy text', gbp)); s3.appendChild(b2);
  out.appendChild(s3);

  const s4 = el('section');
  s4.appendChild(el('h2', null, `The full pack for ${name}`));
  const pr = el('p'); pr.append(el('span', 'price', '₹2,500'), document.createTextNode(`. All ${list.length} searches sorted by what the person wants, text for your five main services, and your Google Business text finished. About 3 days. Reply to the email that brought you here.`));
  s4.appendChild(pr);
  out.appendChild(s4);

  $('results').replaceChildren(out);
}
$('area').addEventListener('input', () => { touched(); render(); });
$('bname').addEventListener('input', () => { touched(); render(); });
$('btype').addEventListener('change', () => { touched(); render(); });
function touched(){ $('sample').hidden = true; }
render();
</script>
</body>
</html>
